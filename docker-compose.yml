services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gyro
      POSTGRES_USER: gyro
      POSTGRES_PASSWORD: local-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyro -d gyro"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - gyro-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      WEB_ORIGIN: http://localhost:3002
      DATABASE_URL: postgres://gyro:local-dev-only@database:5432/gyro
      DATABASE_SSL: disable
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      GYRO_API_URL: http://localhost:3001
    ports:
      - "3002:3000"
    depends_on:
      - api

volumes:
  gyro-postgres:
