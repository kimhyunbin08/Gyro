services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      WEB_ORIGIN: http://localhost:3002
      DATABASE_URL: ${DATABASE_URL:-}
      AZURE_COMMUNICATION_EMAIL_CONNECTION_STRING: ${AZURE_COMMUNICATION_EMAIL_CONNECTION_STRING:-}
      AZURE_COMMUNICATION_EMAIL_SENDER: ${AZURE_COMMUNICATION_EMAIL_SENDER:-}
      BUILDER_ADMIN_TOKEN: ${BUILDER_ADMIN_TOKEN:-}
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      GYRO_API_URL: http://localhost:3001
    ports:
      - "3002:3000"
    depends_on:
      - api
